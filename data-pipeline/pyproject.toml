[project]
name = "data-pipeline"
version = "0.1.0"
description = "Corpus preparation for GEC tagger + style LLM training"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "polars>=1.0",
    "datasets>=2.20",
    "xxhash>=3.4",
    "spacy>=3.7,<3.8",
    "en-core-web-sm",
    "errant>=3.0.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
data-pipeline = "data_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.uv]
# Pin numpy to 1.x because thinc 8.2.x (transitive via spaCy 3.7) is built
# against numpy 1.x ABI and crashes at import time with numpy 2.x.
constraint-dependencies = ["numpy>=1.25,<2"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }
