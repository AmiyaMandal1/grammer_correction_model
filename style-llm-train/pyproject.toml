[project]
name = "style-llm-train"
version = "0.1.0"
description = "Qwen2.5-3B LoRA fine-tuning for style/tone rewriting; GGUF export"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "datasets>=2.20",
    "accelerate>=0.33",
    "peft>=0.12",
    "trl>=0.10",
    "evaluate>=0.4",
    "sacrebleu>=2.4",
    "bert-score>=0.3.13",
    "safetensors>=0.4",
    "typer>=0.12",
    "rich>=13.7",
    "sentencepiece>=0.2.1",
    "tiktoken>=0.13.0",
    "mlx-lm>=0.31.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
style-llm-train = "style_llm_train.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/style_llm_train"]

[tool.uv]
constraint-dependencies = ["numpy>=1.25,<2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
